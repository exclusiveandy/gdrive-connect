name: Convert Drive files
run-name: Convert ${{ inputs.job_id || 'manual' }} (${{ inputs.conversion }})

on:
  workflow_dispatch:
    inputs:
      conversion:
        description: "Conversion to run"
        required: true
        type: choice
        options:
          - png-to-jpg
          - jpg-to-png
          - webp-to-jpg
          - docx-to-pdf
          - pptx-to-pdf
          - xlsx-to-pdf
          - csv-to-xlsx
          - xlsx-to-csv
          - mp4-to-mp3
          - wav-to-mp3
          - mp3-to-wav
          - mov-to-mp4
      job_id:
        description: "Job ID (set by the web page; leave empty for manual runs)"
        required: false
        default: ""
        type: string
      delete_originals:
        description: "Move the original files to Trash after converting"
        required: true
        type: boolean
        default: true
      source_folder:
        description: "Source folder path in My Drive (or id:<folder ID>)"
        required: false
        default: "gdrive-connect/convert-here"
        type: string
      target_folder:
        description: "Target folder path in My Drive (or id:<folder ID>)"
        required: false
        default: "gdrive-connect/convert-done"
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install ffmpeg / LibreOffice (only if needed)
        env:
          MODE: ${{ inputs.conversion }}
        run: |
          case "$MODE" in
            docx-to-pdf|pptx-to-pdf|xlsx-to-pdf)
              sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-writer libreoffice-impress libreoffice-calc ;;
            mp4-to-mp3|wav-to-mp3|mp3-to-wav|mov-to-mp4)
              sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg ;;
          esac

      - name: Run conversion
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          SOURCE: ${{ inputs.source_folder }}
          TARGET: ${{ inputs.target_folder }}
          MODE: ${{ inputs.conversion }}
          DELETE_ORIGINALS: ${{ inputs.delete_originals }}
          JOB_ID: ${{ inputs.job_id }}
        run: python convert.py --source "$SOURCE" --target "$TARGET" --mode "$MODE" --delete-originals "$DELETE_ORIGINALS" --job-id "$JOB_ID"